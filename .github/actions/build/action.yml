name: Build
description: Build dist
inputs:
  target:
    description: "Target Environment"
    required: true
    default: staging
  R2_PROJECT_NAME:
    description: "Folder of the translation catalogues on translations.deriv.com"
    required: false
  TRANSLATIONS_ENVIRONMENT:
    description: "Environment folder of the translation catalogues: staging or production"
    required: false
  # RUDDERSTACK_KEY:
  #   description: "Rudderstack key for initializing analytics"
  #   required: false
  # GROWTHBOOK_CLIENT_KEY:
  #   description: "Growthbook client key for initializing analytics"
  #   required: false
  REMOTE_CONFIG_URL:
    description: "Remote config for enabling cs chat tools"
    required: false
  POSTHOG_KEY:
    description: 'PostHog API key'
    required: false
  POSTHOG_HOST:
    description: 'PostHog host URL'
    required: false
runs:
  using: composite
  steps:
    - name: Building dist for ${{ inputs.target }}
      env:
        TARGET_ENV: ${{ inputs.target }}
        NODE_ENV: ${{ inputs.target }}
        R2_PROJECT_NAME: ${{ inputs.R2_PROJECT_NAME }}
        TRANSLATIONS_ENVIRONMENT: ${{ inputs.TRANSLATIONS_ENVIRONMENT }}
        # RUDDERSTACK_KEY: ${{ inputs.RUDDERSTACK_KEY }}
        # GROWTHBOOK_CLIENT_KEY: ${{ inputs.GROWTHBOOK_CLIENT_KEY }}
        REMOTE_CONFIG_URL: ${{ inputs.REMOTE_CONFIG_URL }}
        POSTHOG_KEY: ${{ inputs.POSTHOG_KEY }}
        POSTHOG_HOST: ${{ inputs.POSTHOG_HOST }}
      run: node_modules/grunt/bin/grunt releaseci --$TARGET_ENV
      shell: bash
